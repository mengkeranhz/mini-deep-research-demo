llm:
  provider: anthropic
  base-url: https://open.bigmodel.cn/api/anthropic
  model: glm-5.3
  api-key: "${LLM_API_KEY}"
  max-tokens: 16384
  temperature: 0
  streaming: true
  # Anthropic 协议扩展思考预算（token 数）；>0 时请求带 thinking 块，须 < max-tokens。
  # 若网关/模型不支持扩展思考返回 400，改回 0 即可关闭。
  thinking-budget-tokens: 16384

storage:
  # 文件保存/读取的根目录。留空时自动回退：工作目录(user.dir) → 项目目录。
  # 也可显式指定绝对路径，或相对工作目录的路径（如 "./data"）。
  root-dir: ""

tools:
  web-search:
    tavily-api-key: "${TAVILY_API_KEY}"
  lbs-service:
    amap-api-key: "${AMAP_API_KEY}"
    # 相邻两次高德请求的最小间隔（毫秒），防 QPS 超限；个人 key 约 3 QPS → 350ms
    min-request-interval-ms: 350
