llm:
  provider: anthropic
  base-url: https://open.bigmodel.cn/api/anthropic
  model: glm-5.3
  api-key: "${LLM_API_KEY}"
  max-tokens: 32768
  # GLM-5.3 推荐采样参数：temperature 1 + top_p 0.95
  temperature: 1
  top-p: 0.95
  streaming: true
  # 思考档位：原样透传给网关顶层 reasoning_effort（档位以网关支持为准，如 low/medium/high/max）；
  # off=关闭思考；留空=不发送、走网关默认档
  thinking: high
  # 上下文压缩阈值：上次响应 inputTokens 超过即压缩重建。原则：模型窗口 ~80% 触发，
  # 为当前轮输入与输出预留空间；GLM-5.3 1M(1,048,576)×80% ≈ 838,861
  context-token-threshold: 838861

storage:
  # 文件保存/读取的根目录。留空时自动回退：工作目录(user.dir) → 项目目录。
  # 也可显式指定绝对路径，或相对工作目录的路径（如 "./data"）。
  root-dir: ""

tools:
  web-search:
    tavily-api-key: "${TAVILY_API_KEY}"
    # web_search 未显式传 max-results 时的默认返回条数（头部结果已覆盖实际可用的来源）
    max-results: 10
  lbs-service:
    amap-api-key: "${AMAP_API_KEY}"
    # 相邻两次高德请求的最小间隔（毫秒），防 QPS 超限；个人 key 约 3 QPS → 350ms
    min-request-interval-ms: 350
  render-card:
    # md2card API key：https://md2card.com/zh/my/api-keys 登录后创建；也可换回环境变量占位 "${MD2CARD_API_KEY}"
    md2card-api-key: "${MD2CARD_API_KEY}"
